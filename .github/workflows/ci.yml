name: MOSAIC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "feat/**", "fix/**"]

jobs:
  python-analytics:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install and test Python analytics
        working-directory: python-analytics
        run: |
          uv sync
          uv run pytest -v
          uv run ruff check .

  frontend-and-rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Stage bundled python-analytics resources
        run: uv run --directory python-analytics python ../scripts/bundle_python_analytics.py
      - name: Install Linux Tauri system libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build and test Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
      - name: Test and Clippy Rust Core
        working-directory: src-tauri
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
